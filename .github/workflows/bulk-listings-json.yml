# One-time (re-runnable) bulk update: makes every scraper/state repo listed in
# tools/repos-to-update.txt also publish docs/listings.json for the
# taildraggers.com child theme v4. Additive only - index.html is unchanged.
#
# Setup (once):
#   1. GitHub > Settings > Developer settings > Fine-grained tokens > Generate new token.
#      Resource owner: taildraggers. Repository access: All repositories.
#      Permissions: Contents = Read and write, Workflows = Read and write.
#   2. In THIS repo: Settings > Secrets and variables > Actions > New repository secret.
#      Name: BULK_TOKEN, value: the token.
#   3. Actions tab > "Bulk: add listings.json to scraper repos" > Run workflow.
# Repos already updated are skipped, so it is safe to run again.
name: "Bulk: add listings.json to scraper repos"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bulk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch, check and push each repo
        env:
          BULK_TOKEN: ${{ secrets.BULK_TOKEN }}
        run: |
          set -u
          if [ -z "${BULK_TOKEN}" ]; then echo "::error::Add the BULK_TOKEN secret first (see the top of this file)."; exit 1; fi
          git config --global user.name "Taildraggers"
          git config --global user.email "noreply@taildraggers.com"
          ok=0; skipped=0; failed=0
          while read -r repo; do
            [ -z "$repo" ] && continue
            echo "::group::$repo"
            rm -rf "work/$repo"
            if ! git clone -q --depth 5 "https://x-access-token:${BULK_TOKEN}@github.com/taildraggers/${repo}.git" "work/$repo"; then
              echo "::warning::$repo: clone failed"; failed=$((failed+1)); echo "::endgroup::"; continue
            fi
            if grep -q "listings.json for taildraggers.com" "work/$repo/main.py" 2>/dev/null; then
              echo "$repo: already updated"; skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi
            if python tools/patch_repo.py "work/$repo" && python -m py_compile "work/$repo/main.py"; then
              branch=$(git -C "work/$repo" rev-parse --abbrev-ref HEAD)
              git -C "work/$repo" add main.py README.md .github/workflows
              git -C "work/$repo" commit -q -m "Also publish docs/listings.json for taildraggers.com theme v4" \
                -m "The site now shows these listings natively instead of in an iframe. index.html is produced exactly as before."
              if git -C "work/$repo" push -q origin "HEAD:${branch}"; then
                echo "$repo: updated on ${branch}"; ok=$((ok+1))
              else
                echo "::warning::$repo: push failed"; failed=$((failed+1))
              fi
            else
              echo "::warning::$repo: patch or check failed, left unchanged"; failed=$((failed+1))
            fi
            echo "::endgroup::"
          done < tools/repos-to-update.txt
          echo "Updated: $ok  Already done: $skipped  Failed: $failed"
          echo "### Updated: $ok · Already done: $skipped · Failed: $failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
