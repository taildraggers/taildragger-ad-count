<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taildragger Listings Count</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #333;
    text-align: center;
  }
  .stat b {
    font-size: 1.5rem;
    color: #0a5;
    margin: 0 0.3em;
  }
</style>
</head>
<body>
  <div class="stat">There are <b id="count">&hellip;</b> Taildragger Listings</div>

  <script>
    // Relative path so this works whether Pages serves it from the repo
    // root or a project subpath (username.github.io/reponame/).
    fetch('./ad-count.json', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('bad response');
        return r.json();
      })
      .then(function (data) {
        document.getElementById('count').textContent = data.total.toLocaleString();
      })
      .catch(function () {
        document.getElementById('count').textContent = 'N/A';
      });
  </script>
</body>
</html>
